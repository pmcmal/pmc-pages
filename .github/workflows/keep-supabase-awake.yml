name: Keep Supabase Awake

# Darmowy projekt Supabase usypia po 7 dniach bez ruchu. Ten workflow odpytuje
# raz na kilka dni edge function (prawdziwe wywolanie, liczy sie jako aktywnosc),
# zeby projekt sie nie wstrzymywal.
#
# Uwaga: bezposrednie pingowanie golego /rest/v1/ przestalo dzialac z kluczem anon
# ("Only the service_role API key can be used for this endpoint") - to nie byl
# problem z kluczem ani z uspionym projektem, tylko z metoda pingowania. Wywolanie
# istniejacej edge function dziala niezawodnie i jest bardziej wiarygodnym sygnalem
# aktywnosci niz gole zapytanie do schema introspection.
#
# UWAGA 2: GitHub sam wylacza zaplanowane workflow po 60 dniach bez commita
# w repo (stan DISABLED_INACTIVITY) - wlasnie to sie stalo: ostatni ping
# 2026-09-25, bo ostatni commit byl 2026-07-25. Trzeba wtedy recznie kliknac
# "Enable workflow" w zakladce Actions. Dlatego glownym pingiem jest teraz
# cron Vercela (api/keep-alive.js + sekcja "crons" w vercel.json), ktory nie
# ma takiego limitu, a ten workflow zostaje jako zapas.

on:
  schedule:
    - cron: "0 6 */3 * *" # co ~3 dni o 6:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Edge Function
        run: |
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://nkwowvytmmssblimxeko.supabase.co/functions/v1/get-lyrics" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"artist":"Queen","title":"Bohemian Rhapsody"}')
          echo "Supabase Edge Function responded: $STATUS"
          cat /tmp/response.txt
          echo
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Unexpected status code from edge function: $STATUS"
            exit 1
          fi
        env:
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rd293dnl0bW1zc2JsaW14ZWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzkxNDYsImV4cCI6MjA5OTI1NTE0Nn0.QUoNQngGmYnyswJwEv4S7XwmByEzK6jLt86-AZvNjKc"
