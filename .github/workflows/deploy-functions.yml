name: Deploy Edge Functions

# CI buduje tylko frontend, a Vercel wdraza wylacznie statyczna strone - edge
# functions trzeba bylo dotad wypychac recznie z lokalnego `supabase functions
# deploy`. Przez to kod w repo potrafil sie rozjechac z tym, co naprawde biegnie
# na Supabase. Ten workflow wdraza kazda zmieniona funkcje po merge'u do main.
#
# Wymagane sekrety repozytorium (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN - token z https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID   - ref projektu (nkwowvytmmssblimxeko)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function:
        description: "Nazwa pojedynczej funkcji (puste = wszystkie)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SINGLE: ${{ github.event.inputs.function }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Brak sekretu SUPABASE_ACCESS_TOKEN lub SUPABASE_PROJECT_ID"
            exit 1
          fi

          # Bez --no-verify-jwt: funkcje sa wolane kluczem anon (poprawny JWT),
          # a te wymagajace logowania dodatkowo sprawdzaja role w kodzie.
          # Dolozenie tej flagi oslabiloby obecne ustawienia.
          if [ -n "$SINGLE" ]; then
            echo "Wdrazam pojedyncza funkcje: $SINGLE"
            supabase functions deploy "$SINGLE" --project-ref "$PROJECT_ID"
          else
            # Wywolanie bez nazwy wdraza wszystkie funkcje naraz. Iterowanie po
            # katalogach bylo bledem: wpadal w nie tez _shared, ktory nie jest
            # funkcja (nazwa musi zaczynac sie od litery), tylko wspolnym kodem
            # doklejanym do funkcji, ktore go importuja.
            supabase functions deploy --project-ref "$PROJECT_ID"
          fi
